server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Never let the browser cache these — content.js fetches them fresh on
    # every page load, and stale copies would show old edits after a CMS save.
    location /content/ {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }
}
